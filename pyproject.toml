[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-research-skills"
version = "0.6.0"
description = "A survey-first research suite for AI/ML — one survey engine, four exits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []   # stdlib only — the hooks run in whatever python3 the user has

[project.urls]
Repository = "https://github.com/signalridge/ai-research-skills"

[project.scripts]
ai-research-skills = "ai_research_skills.cli:main"

# The suite's assets ARE package data: they live under src/ai_research_skills/assets/ and hatchling
# puts every file in the package directory into the wheel, not just the .py. So there is
# one asset layout, the same one in a checkout and in an installed copy.
[tool.hatch.build.targets.wheel]
packages = ["src/ai_research_skills"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.1",
]

[tool.basedpyright]
# Every Python file in the repo. src/ covers the package and, under ai_research_skills/assets/,
# the four hooks and the validator that ship with it.
include = [
    "src",
    "tests",
    "install.py",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "dist",
    ".claude",   # install output, not source
]
typeCheckingMode = "standard"
pythonVersion = "3.10"   # same floor as ruff's target-version and requires-python
venvPath = "."
# The guards import their sibling _payload module by directory, the way Claude Code
# and Codex run them (script dir on sys.path[0]). Tell the checker the same thing.
extraPaths = ["src", "src/ai_research_skills/assets/hooks", "src/ai_research_skills/assets/scripts"]
venv = ".venv"           # resolves pyyaml/jsonschema from the dev group for import checks
