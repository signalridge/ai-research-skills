[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-research-skills"
version = "0.8.0"
description = "A user-invoked, skills-driven research toolbox for AI/ML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []   # stdlib only — the installer and optional linter need no packages

[project.urls]
Repository = "https://github.com/signalridge/ai-research-skills"

[project.scripts]
ai-research-skills = "ai_research_skills.cli:main"

# The suite's assets ARE package data: they live under src/ai_research_skills/assets/ and hatchling
# puts every file in the package directory into the wheel, not just the .py. So there is
# one asset layout, the same one in a checkout and in an installed copy.
[tool.hatch.build.targets.wheel]
packages = ["src/ai_research_skills"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
]

[tool.basedpyright]
# Every Python file in the repo. src/ covers the package and the legacy recognizers,
# optional linter, and installer support that ship with it.
include = [
    "src",
    "tests",
    "install.py",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "dist",
    ".claude",   # install output, not source
]
typeCheckingMode = "standard"
pythonVersion = "3.10"   # same floor as ruff's target-version and requires-python
venvPath = "."
# Legacy hook files import sibling modules by directory; keep the source tree available to
# the checker even though fresh installs do not configure those files.
extraPaths = ["src", "src/ai_research_skills/assets/hooks", "src/ai_research_skills/assets/scripts"]
venv = ".venv"           # resolves pyyaml/jsonschema from the dev group for import checks
