name: test
on:
  push:
    branches: [main]
  pull_request:
# One toolchain everywhere: uv provisions the interpreter, resolves the dev group from
# uv.lock, and runs everything. No pip, no setup-python — CI and a laptop see the same
# ruff and basedpyright, so "clean here, dirty there" cannot happen.
env:
  UV_FROZEN: "1" # fail if uv.lock is stale rather than silently re-resolving
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # The optional linter runs in whatever python3 the user already has, so the default
      # path must work with nothing installed. --no-project reproduces that environment.
      - name: tests (bare interpreter, no packages)
        run: uv run --no-project python tests/run_tests.py
      - name: tests (with structural validation)
        run: uv run --group dev python tests/run_tests.py
      - name: validator against the worked example
        run: |
          uv run --group dev python src/ai_research_skills/assets/scripts/rs_validate.py \
            examples/worked-survey/.research/survey/retrieval-augmented-agents
      # A backstop only.  "Does it fail?" is satisfied by a single error, so it stayed
      # green while four of the fixture's five advertised defect classes went undetected.
      # test_broken_fixture_reports_every_claimed_defect asserts each class by name; this
      # step just guarantees the non-zero exit an operator would look for.
      - name: validator rejects the broken fixture
        run: |
          if uv run --group dev python src/ai_research_skills/assets/scripts/rs_validate.py tests/fixtures/broken-survey
          then
            echo "::error::broken fixture passed validation — a check has regressed"
            exit 1
          fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: json and yaml parse
        run: |
          uv run --group dev python - <<'PY'
          import json, pathlib, sys, yaml
          bad = []
          skip = {".git", ".venv", "node_modules", "__pycache__", ".claude", "dist"}
          for pat, load in (("*.json", json.loads), ("*.yml", yaml.safe_load),
                            ("*.yaml", yaml.safe_load)):
              for p in pathlib.Path(".").rglob(pat):
                  if skip & set(p.parts): continue
                  try: load(p.read_text())
                  except Exception as e: bad.append(f"{p}: {e}")
          for b in bad: print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY
      # Shared with `just skills` and tests/run_tests.py so the rules exist once, and run
      # with --no-project because the checker must work on a bare interpreter.
      - name: skill and command frontmatter
        run: uv run --no-project python tests/check_frontmatter.py
      - name: ruff
        run: |
          uv run --group dev ruff check src/ tests/ install.py
          uv run --group dev ruff format --check src/ tests/ install.py
      - name: basedpyright
        run: uv run --group dev basedpyright
      # Relative links break when a file moves; the skills are worse, because they get
      # installed into other projects where repo-root paths do not exist at all.
      - name: markdown links resolve
        run: |
          uv run --group dev python - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.md"):
              if {".git", ".venv", ".claude", "dist"} & set(p.parts): continue
              for link in re.findall(r"\]\((?!https?:|#)([^)#]+)", p.read_text()):
                  if not (p.parent / link).exists():
                      bad.append(f"{p}: dead link -> {link}")
          for b in bad: print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The wheel is how uvx installs the suite; it must carry the standalone assets.
      - name: wheel smoke build
        run: |
          uv build
          unzip -l dist/*.whl \
            | grep "ai_research_skills/assets/skills/ars-survey/SKILL.md"
      # Installing into a scratch project is the only test of the thing users actually run.
      - name: install into a scratch project
        run: |
          mkdir -p /tmp/scratch
          uv run --with dist/*.whl ai-research-skills install /tmp/scratch
          uv run --with dist/*.whl ai-research-skills doctor /tmp/scratch
          test -f /tmp/scratch/.claude/skills/ars-survey/SKILL.md
          test -f /tmp/scratch/.claude/commands/ars-lint.md
          test ! -e /tmp/scratch/.claude/settings.json
          test ! -d /tmp/scratch/.claude/hooks
