# ILLUSTRATIVE EXAMPLE. Axes are copied VERBATIM from protocol.yml — if they differ,
# the taxonomy was built after searching and every empty cell is an artifact.
axes:
  - name: method
    values: [iterative retrieval, long-context]
  - name: control
    values: [none, fixed token budget, fixed retrieval recall]
  - name: evaluation
    values: [2-hop, 3+-hop]

cells:
  - coords: {method: iterative retrieval, control: fixed token budget, evaluation: 2-hop}
    occupants: [alpha2025iterative]
    state: occupied
  - coords: {method: long-context, control: fixed token budget, evaluation: 2-hop}
    occupants: [beta2025longctx]
    state: occupied
  - coords: {method: iterative retrieval, control: none, evaluation: 3+-hop}
    occupants: [gamma2026threehop]
    state: occupied

  # The gap. Empty, and discriminated — neighbours are live, so unexplored not abandoned.
  - coords: {method: iterative retrieval, control: fixed retrieval recall, evaluation: 2-hop}
    occupants: []
    state: unexplored
    trend_evidence: "Neighbour cells (fixed token budget, 2-hop) grew 2023:12 -> 2025:180 works and are still rising in 2026. The area is live; this control is simply untried."
    gap_id: G1
  - coords: {method: long-context, control: fixed retrieval recall, evaluation: 2-hop}
    occupants: []
    state: unexplored
    trend_evidence: "Same neighbourhood as above; the long-context arm of the same missing comparison."
    gap_id: G1

  # `avoided`, not `abandoned` — the distinction that decides G2. Work here stopped, but
  # papers keep naming it as future work without attempting it. Scores 5, not 1.
  - coords: {method: long-context, control: none, evaluation: 3+-hop}
    occupants: []
    state: avoided
    trend_evidence: "Neighbour volume flat since 2024, so the work stopped — but four papers across 2024-2026 (alpha2025iterative §7, beta2025longctx §6, gamma2026threehop §5, and two outside the corpus) name 3+-hop long-context evaluation as future work or a known limitation, and none attempt it. Nobody reports trying and failing. Field is routing around it, not past it."
    gap_id: G2
  - coords: {method: iterative retrieval, control: fixed retrieval recall, evaluation: 3+-hop}
    occupants: []
    state: undecided
  - coords: {method: long-context, control: fixed retrieval recall, evaluation: 3+-hop}
    occupants: []
    state: undecided

recall_diagnostic:
  includes_by_mode: {keyword: 2, citation_chain: 1, venue_author: 1, contrarian: 1}
  note: "All four modes contributed. beta2025longctx came only from the contrarian pass — keyword search used the mainstream vocabulary and the citation chains never reached it, because the papers it contradicts do not cite it. Dropping Mode D would have produced a survey reporting a consensus that does not exist."
